[project]
name = "youdownloader"
version = "0.1.0"
description = "Local YouTube downloader desktop app with FastAPI, pywebview and vanilla JS."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.2.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pywebview>=5.2",
    "yt-dlp>=2026.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
